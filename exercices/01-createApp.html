<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Exercice 1 - createApp()</title>
</head>
<body>
  <div id="app">
    <h1>{{ message }}</h1>
  </div>

  <!-- Chargement de Vue.js 3 depuis le CDN -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script>
    const { createApp } = Vue

    // createApp() crée l'application, mount() l'attache à #app
    createApp({
      data() {
        return {
          message: 'Bonjour Vue.js !'
        }
      }
    }).mount('#app')
  </script>
</body>
</html>
