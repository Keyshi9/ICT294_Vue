<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Apprendre Vue.js</title>
</head>
<body>
  <div id="app">
    <h1>{{ product }}</h1>
    <p>Prix : {{ price }} €</p>
    <p>Quantité : {{ quantity }}</p>

    <button @click="increaseQuantity">
      +
    </button>
    <button @click="decreaseQuantity">
      -
    </button>
  </div>

  <!-- Chargement de Vue.js 3 depuis le CDN -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script>
    const { createApp } = Vue

    createApp({
      // data() définit les données réactives de l'application
      data() {
        return {
          product: 'Chaussettes',
          price: 12,
          quantity: 1
        }
      },
      // methods contient les fonctions de l'application
      methods: {
        increaseQuantity() {
          this.quantity++
        },
        decreaseQuantity() {
          this.quantity--
        }
      }
    }).mount('#app')
  </script>
</body>
</html>
