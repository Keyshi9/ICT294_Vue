<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Apprendre Vue.js</title>
</head>
<body>
  <div id="app">
    <h1>{{ product }}</h1>
    <p>Prix : {{ price }} €</p>
    <p>Quantité : {{ quantity }}</p>

    <button @click="increaseQuantity">
      +
    </button>
    <button @click="decreaseQuantity">
      -
    </button>

    <!-- Étape 4 : computed -->
    <h3>Total : {{ totalPrice }} €</h3>

    <!-- Étape 5 : v-if / v-else -->
    <p v-if="isAvailable">
      Produit disponible !
    </p>
    <p v-else>
      Produit indisponible.
    </p>

    <!-- v-else-if pour tester plusieurs conditions -->
    <p v-if="stock > 10">
      Stock suffisant
    </p>
    <p v-else-if="stock > 0">
      Stock limité
    </p>
    <p v-else>
      Rupture de stock
    </p>

    <!-- v-show masque l'élément avec CSS (display: none) sans le retirer du DOM -->
    <p v-show="isAvailable">Livraison gratuite dès 50 € d'achat.</p>
  </div>

  <!-- Chargement de Vue.js 3 depuis le CDN -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script>
    const { createApp } = Vue

    createApp({
      // data() définit les données réactives de l'application
      data() {
        return {
          product: 'Chaussettes',
          price: 12,
          quantity: 1,
          isAvailable: true,
          stock: 5
        }
      },
      // methods contient les fonctions de l'application
      methods: {
        increaseQuantity() {
          this.quantity++
        },
        decreaseQuantity() {
          this.quantity--
        }
      },
      // computed calcule des valeurs à partir des données réactives
      computed: {
        totalPrice() {
          return this.price * this.quantity
        }
      }
    }).mount('#app')
  </script>
</body>
</html>
